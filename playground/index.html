<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecliris Playground</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    h1 {
      font-weight: 200;
      letter-spacing: 6px;
      margin-bottom: 8px;
      font-size: 2.5rem;
    }
    .tagline {
      opacity: 0.6;
      margin-bottom: 40px;
      font-size: 14px;
      letter-spacing: 2px;
    }
    #ecliris-container {
      width: 600px;
      max-width: 90vw;
    }
    #result {
      margin-top: 24px;
      font-size: 13px;
      font-family: 'SF Mono', Monaco, monospace;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>ECLIRIS</h1>
  <p class="tagline">Observe the unseen.</p>
  <div id="ecliris-container"></div>
  <div id="result"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
