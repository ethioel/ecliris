<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecliris Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      padding: 20px;
    }
    h1 {
      font-weight: 200;
      letter-spacing: 6px;
      margin-bottom: 8px;
      font-size: 2.5rem;
    }
    .tagline {
      opacity: 0.6;
      margin-bottom: 40px;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .ecliris-card {
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 600px;
    }
    .ecliris-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .ecliris-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      opacity: 0.85;
      text-transform: uppercase;
    }
    .ecliris-viewport {
      width: 100%;
      height: 400px;
      background: radial-gradient(ellipse at center, #0a0a1e 0%, #000 100%);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      cursor: none;
    }
    .ecliris-viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ecliris-status {
      font-size: 13px;
      opacity: 0.7;
      text-align: center;
      min-height: 20px;
      transition: all 0.3s;
    }
    .ecliris-status.success { color: #00ffcc; opacity: 1; }
    .ecliris-status.error { color: #ff4466; opacity: 1; }
    #result {
      margin-top: 24px;
      font-size: 13px;
      font-family: 'SF Mono', Monaco, monospace;
      opacity: 0.8;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>ECLIRIS</h1>
  <p class="tagline">Observe the unseen.</p>
  
  <div class="ecliris-card">
    <div class="ecliris-header">
      <span class="ecliris-title">Ecliris · Security Verification</span>
    </div>
    <div class="ecliris-viewport" id="viewport">
      <canvas id="canvas"></canvas>
    </div>
    <div class="ecliris-status" id="status">Move cursor to reveal the universe...</div>
  </div>
  
  <div id="result"></div>

  <script>
    // ============================================
    // ECLIRIS ENGINE (Standalone Version)
    // ============================================
    
    const GRAVITY_RADIUS = 200;
    const EVENT_HORIZON = 15;
    const TARGET_RADIUS = 25;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    let particles = [];
    let targets = [];
    let mouse = { x: 0, y: 0, active: false };
    let pathData = [];
    let consumedCount = 0;

    // Initialize canvas size
    function resize() {
      const rect = viewport.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resize();
    window.addEventListener('resize', resize);

    // Initialize universe
    function initUniverse() {
      particles = [];
      for (let i = 0; i < 600; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: 0, vy: 0,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.6 + 0.2
        });
      }
      
      targets = [];
      for (let i = 0; i < 3; i++) {
        targets.push({
          x: Math.random() * (canvas.width - 100) + 50,
          y: Math.random() * (canvas.height - 100) + 50,
          consumed: false,
          radius: TARGET_RADIUS
        });
      }
    }
    initUniverse();

    // Mouse events
    viewport.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
      
      pathData.push({ x: mouse.x, y: mouse.y, t: performance.now() });
      if (pathData.length > 300) pathData.shift();
    });

    viewport.addEventListener('mouseleave', () => {
      mouse.active = false;
    });

    // Animation loop
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update particles
      particles.forEach((p) => {
        if (mouse.active) {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const dist = Math.hypot(dx, dy);

          if (dist < GRAVITY_RADIUS && dist > EVENT_HORIZON) {
            const force = (GRAVITY_RADIUS - dist) / GRAVITY_RADIUS;
            p.vx += (dx / dist) * force * 0.5;
            p.vy += (dy / dist) * force * 0.5;
          }

          if (dist < EVENT_HORIZON * 2.5) {
            p.size = Math.min(p.size * 1.03, 4);
          }

          if (dist < EVENT_HORIZON) {
            p.x = Math.random() * canvas.width;
            p.y = Math.random() * canvas.height;
            p.vx = 0; p.vy = 0;
            p.size = Math.random() * 1.5 + 0.5;
          }
        }

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;

        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Update targets
      consumedCount = 0;
      targets.forEach((t) => {
        if (t.consumed) { consumedCount++; return; }
        
        if (mouse.active) {
          const dist = Math.hypot(mouse.x - t.x, mouse.y - t.y);
          if (dist < EVENT_HORIZON + t.radius) {
            t.consumed = true;
            consumedCount++;
            status.textContent = `Stellar Anchors Consumed: ${consumedCount} / 3`;
            status.className = 'ecliris-status';
            
            if (consumedCount === 3) {
              verifyHumanity();
            }
          }
        }

        // Draw target
        const gradient = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 20);
        gradient.addColorStop(0, 'rgba(100, 200, 255, 1)');
        gradient.addColorStop(0.5, 'rgba(110, 69, 226, 0.6)');
        gradient.addColorStop(1, 'rgba(110, 69, 226, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 20, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw singularity (black hole cursor)
      if (mouse.active) {
        // Accretion disk
        ctx.strokeStyle = 'rgba(255, 150, 50, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, EVENT_HORIZON + 8, 0, Math.PI * 2);
        ctx.stroke();

        // Photon ring
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, EVENT_HORIZON + 2, 0, Math.PI * 2);
        ctx.stroke();

        // Event horizon
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, EVENT_HORIZON, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Behavioral analysis
    function calculateAngularMomentum(path) {
      if (path.length < 3) return 0;
      let momentum = 0;
      for (let i = 2; i < path.length; i++) {
        const v1x = path[i-1].x - path[i-2].x;
        const v1y = path[i-1].y - path[i-2].y;
        const v2x = path[i].x - path[i-1].x;
        const v2y = path[i].y - path[i-1].y;
        momentum += Math.abs(v1x * v2y - v1y * v2x);
      }
      return momentum / path.length;
    }

    function calculateVelocityVariance(path) {
      if (path.length < 2) return 0;
      const velocities = [];
      for (let i = 1; i < path.length; i++) {
        const dt = path[i].t - path[i-1].t;
        if (dt > 0) {
          velocities.push(Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y) / dt);
        }
      }
      if (velocities.length === 0) return 0;
      const avg = velocities.reduce((a, b) => a + b, 0) / velocities.length;
      return velocities.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / velocities.length;
    }

    // Verify humanity by calling the server
    async function verifyHumanity() {
      status.textContent = 'Verifying Singularity...';
      
      const momentum = calculateAngularMomentum(pathData);
      const variance = calculateVelocityVariance(pathData);
      
      const telemetry = {
        path: pathData,
        angularMomentum: momentum,
        targetsConsumed: 3
      };

      try {
        const res = await fetch('http://localhost:3000/v1/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            siteKey: 'test_key_playground',
            telemetry
          })
        });
        
        const data = await res.json();
        
        if (data.success) {
          status.textContent = '✓ Verification Complete';
          status.className = 'ecliris-status success';
          result.textContent = 'Token: ' + data.token.substring(0, 32) + '...';
          result.style.color = '#00ffcc';
          console.log('✅ Success! Full token:', data.token);
        } else {
          throw new Error(data.error || 'Verification failed');
        }
      } catch (err) {
        status.textContent = '✗ ' + (err.message || 'Verification failed');
        status.className = 'ecliris-status error';
        result.textContent = 'Error: ' + err.message;
        result.style.color = '#ff4466';
        console.error('❌ Error:', err);
      }
    }
  </script>
</body>
</html>
